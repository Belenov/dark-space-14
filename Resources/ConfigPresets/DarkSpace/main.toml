# Configuration preset for Dark Space servers.
# Enable with `config.presets = "DarkSpace/main"` in server_config.toml.

[game]
hostname = "[RU] Dark Space"
desc = "Далёкая вселенная, где холодная война так и не закончилась."
lobbyenabled = true
soft_max_players = 60

[hub]
tags = "lang:ru,rp:med"

# Closer default camera: zoom the player's eye in (1 = upstream, lower = closer).
# 0.65 shows about 14x10 tiles instead of 21x15, same on every monitor.
[darkspace]
default_zoom = 0.65
