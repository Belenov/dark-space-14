# Configuration preset for Dark Space servers.
# Enable with `config.presets = "DarkSpace/main"` in server_config.toml.

[game]
hostname = "[RU] Dark Space"
desc = "Далёкая вселенная, где холодная война так и не закончилась."
lobbyenabled = true
soft_max_players = 60

[hub]
tags = "lang:ru,rp:med"

# Closer default camera that keeps pixels crisp: the view is about 10 tiles tall (upstream 15),
# drawn at a whole-number scale so every sprite pixel is an even square on any monitor.
# Fractional eye zoom (darkspace.default_zoom) is left at 1, since it made pixels uneven.
[darkspace]
view_tiles = 10
