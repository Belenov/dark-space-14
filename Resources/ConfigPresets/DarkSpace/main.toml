# Configuration preset for Dark Space servers.
# Enable with `config.presets = "DarkSpace/main"` in server_config.toml.

[game]
hostname = "[RU] Dark Space"
desc = "Далёкая вселенная, где холодная война так и не закончилась."
lobbyenabled = true
soft_max_players = 60

[hub]
tags = "lang:ru,rp:med"

# Closer default camera: 18x13 tiles instead of upstream 21x15 (~15% bigger sprites).
[viewport]
minimum_width = 13
maximum_width = 18

[darkspace]
viewport_height = 13
